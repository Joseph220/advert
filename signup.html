<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - AdVibe</title>
  <link rel="stylesheet" href="ads.css">
</head>
<body>
  <header>
    <h1><a href="ads.html">AdVibe</a></h1>
    <nav>
      <a href="login.html">Login</a>
      <a href="signup.html" class="active">Sign Up</a>
    </nav>

    <div class="menu-icon" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>

    <div class="mobile-nav" id="mobileMenu">
      <a href="login.html" onclick="toggleMenu()">Login</a>
      <a href="signup.html" onclick="toggleMenu()">Sign Up</a>
    </div>
  </header>

  <section class="login-page">
    <div class="login-card">
      <h2>Create an Account</h2>
      <p>Sign up to access your creative ads dashboard.</p>
      <form id="signupForm">
        <input type="text" placeholder="Full Name" required />
        <input type="email" placeholder="Email Address" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
      </form>
      <p class="signup-note">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 AdVibe Agency. All Rights Reserved.</p>
  </footer>

  <script>
    function toggleMenu() {
      const mobileMenu = document.getElementById('mobileMenu');
      mobileMenu.classList.toggle('show');
    }

    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('signupForm');
      if (!form) return;
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        localStorage.setItem('loggedIn', 'true');
        const next = getQueryParam('next') || 'ads.html';
        const dest = next && next.startsWith('#') ? 'ads.html' + next : next;
        window.location.href = dest;
      });

      if (localStorage.getItem('loggedIn') === 'true') {
        const next = getQueryParam('next');
        if (next) {
          const dest = next.startsWith('#') ? 'ads.html' + next : next;
          window.location.href = dest;
        }
      }
    });
  </script>
</body>
</html>
