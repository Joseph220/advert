<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AdVibe</title>
  <link rel="stylesheet" href="ads.css">
</head>
<body>
  <header>
    <h1><a href="ads.html">AdVibe</a></h1>
    <nav>
      <a href="ads.html#about">About</a>
      <a href="ads.html#services">Services</a>
      <a href="ads.html#portfolio">Portfolio</a>
      <a href="ads.html#contact">Contact</a>
      <a class="login-link" href="login.html">Login</a>
      <a class="signup-link" href="signup.html">Sign Up</a>
    </nav>

    <div class="menu-icon" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>

    <div class="mobile-nav" id="mobileMenu">
      <a href="ads.html#about" onclick="toggleMenu()">About</a>
      <a href="ads.html#services" onclick="toggleMenu()">Services</a>
      <a href="ads.html#portfolio" onclick="toggleMenu()">Portfolio</a>
      <a href="ads.html#contact" onclick="toggleMenu()">Contact</a>
      <a href="login.html" onclick="toggleMenu()">Login</a>
      <a href="signup.html" onclick="toggleMenu()">Sign Up</a>
    </div>
  </header>

  <section class="login-page">
    <div class="login-card">
      <h2>Welcome Back</h2>
      <p>Sign in to access your dashboard and campaign tools.</p>
      <form id="loginForm">
        <input type="email" placeholder="Email Address" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      <p class="signup-note">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 AdVibe Agency. All Rights Reserved.</p>
  </footer>

  <script>
    function toggleMenu() {
      const mobileMenu = document.getElementById('mobileMenu');
      mobileMenu.classList.toggle('show');
    }
    
    // Parse query parameter helper
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    // Handle a simple client-side "login" and redirect back
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('loginForm');
      if (!form) return;
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        // Simulate successful login
        localStorage.setItem('loggedIn', 'true');
        const next = getQueryParam('next') || 'ads.html';
        let dest = next;
        if (next && next.startsWith('#')) dest = 'ads.html' + next;
        window.location.href = dest;
      });

      // If already logged in, optionally redirect to next immediately
      if (localStorage.getItem('loggedIn') === 'true') {
        const next = getQueryParam('next');
        if (next) {
          const dest = next.startsWith('#') ? 'ads.html' + next : next;
          window.location.href = dest;
        }
      }
    });
  </script>
</body>
</html>
